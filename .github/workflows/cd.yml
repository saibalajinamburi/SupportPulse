name: CD -- Deploy on Release

# Triggered ONLY when a GitHub Release is published (e.g. v1.0.0)
# This represents Continuous Deployment: code that passed CI gets deployed.
on:
  release:
    types: [published]

jobs:
  deploy:
    name: Build & Deploy Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract release version
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/supportpulse-api:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/supportpulse-api:latest

      - name: Deployment summary
        run: |
          echo "=== Deployment Complete ==="
          echo "Version:    ${{ steps.meta.outputs.version }}"
          echo "Image:      ${{ secrets.DOCKER_USERNAME }}/supportpulse-api:${{ steps.meta.outputs.version }}"
          echo "Dashboard:  streamlit run dashboard/streamlit_app.py --server.port 8501"
          echo "API:        uvicorn app.main:app --host 0.0.0.0 --port 8000"
          echo "MLflow:     mlflow ui --port 5000"
